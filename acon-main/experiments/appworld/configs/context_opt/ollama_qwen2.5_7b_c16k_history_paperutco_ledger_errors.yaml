# Ledger ablation: paper D.7 @512 + state ledger with only the "errors" sections.
# Otherwise identical to ollama_qwen2.5_7b_c16k_history_paperutco_ledger.yaml.
type: "history"
model: "ollama/qwen2.5-7b-c16k"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_paper_d7_utco"
history_summarization_threshold: 512
preserve_last_k_turns: 1
history_summary_rule: "reset"
temperature: 0.0
state_ledger: true
state_ledger_sections: ["errors"]
