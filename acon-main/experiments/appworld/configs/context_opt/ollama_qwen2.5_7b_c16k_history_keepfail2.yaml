# D.7 + D.5's keep-failures line, and "tool/API log output" removed from D.7's delete rule (which
# contradicted it). Otherwise identical to ollama_qwen2.5_7b_c16k_history_paperutco.yaml (512, no ledger).
type: "history"
model: "ollama/qwen2.5-7b-c16k"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_paper_d7_keepfail2"
history_summarization_threshold: 512
preserve_last_k_turns: 1
history_summary_rule: "reset"
temperature: 0.0
