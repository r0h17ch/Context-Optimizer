# D.7 (paper UTCO history guideline) + one line from D.5: "Include key info from errors or failed attempts
# to prevent repeated mistakes." Otherwise identical to ollama_qwen2.5_7b_c16k_history_paperutco.yaml (threshold 512, no ledger).
type: "history"
model: "ollama/qwen2.5-7b-c16k"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_paper_d7_keepfail"
history_summarization_threshold: 512
preserve_last_k_turns: 1
history_summary_rule: "reset"
temperature: 0.0
