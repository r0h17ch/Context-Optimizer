# ACON paper guideline (D.7) at threshold 512 + verbatim state ledger (ctxopt/state_ledger.py).
# Identical to ollama_qwen2.5_7b_c16k_history_paperutco.yaml except state_ledger: true.
type: "history"
model: "ollama/qwen2.5-7b-c16k"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_paper_d7_utco"
history_summarization_threshold: 512
preserve_last_k_turns: 1
history_summary_rule: "reset"
temperature: 0.0
state_ledger: true
