# ACON with the paper's own optimized AppWorld guidelines (UTCO): history = Prompt D.7,
# observation = Prompt D.10, copied verbatim from the ACON paper appendix.
# Same compressor, num_ctx and thresholds (512/256) as the naive *_c16k arms, so the
# guideline is the only change.
type: "obs"
model: "ollama/qwen2.5-7b-c16k"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_user: "prompt_obs_paper_d10_utco"
obs_summarization_threshold: 256
temperature: 0.0
